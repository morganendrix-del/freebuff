name: freebuff-local

# Local development stack only. Production runs Postgres as a managed service and swaps the
# container sandbox for a Firecracker microVM behind packages/sandbox-orchestrator.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freebuff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freebuff}
      POSTGRES_DB: ${POSTGRES_DB:-freebuff_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-freebuff} -d ${POSTGRES_DB:-freebuff_platform}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: ${SANDBOX_IMAGE:-freebuff/sandbox:local}
    restart: unless-stopped
    # Hostile-input defaults (DECISIONS.md D7). The orchestrator applies the same limits per session.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
      - /run:rw,noexec,nosuid,nodev,size=16m
      - /workspace:rw,nosuid,nodev,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    memswap_limit: 2g
    cpus: "2.0"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    environment:
      SANDBOX_HTTP_PORT: ${SANDBOX_HTTP_PORT:-8788}
      SANDBOX_EGRESS_MODE: ${SANDBOX_EGRESS_MODE:-allowlist}
    networks:
      - sandbox-runtime
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:8788/health'); if (!response.ok) process.exit(1);",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:

networks:
  sandbox-runtime:
    driver: bridge
    # Local convenience only. Production replaces this with an allowlist egress proxy and, on
    # microVMs, a host-level network policy derived from SandboxSpec.egress.
